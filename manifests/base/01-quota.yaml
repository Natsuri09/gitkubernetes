# =============================================================================
# File    : manifests/base/01-quota.yaml
# Purpose : Hard resource ceiling for the namespace (values set by Task 1).
# Apply   : kubectl apply -f manifests/base/01-quota.yaml
# Check   : kubectl describe resourcequota nb-quota
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nb-quota
  namespace: nb-02230137
  labels:
    app.kubernetes.io/part-of: campus-noticeboard
    cte412/practical: "06"
    cte412/student: "02230137"
spec:
  hard:
    # Once requests/limits are capped, EVERY container must declare them or its
    # Pod is rejected. The LimitRange in 02-limitrange.yaml supplies defaults.
    requests.cpu: "1"        # 1 core guaranteed in total (set by the task)
    requests.memory: 1Gi     # set by the task
    limits.cpu: "2"          # set by the task
    limits.memory: 2Gi       # set by the task
    pods: "15"               # set by the task; peak use is 8 (Task 8)
    count/services: "4"      # set by the task; this practical uses 3
